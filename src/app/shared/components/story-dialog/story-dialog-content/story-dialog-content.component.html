<ng-container *transloco="let transloco">
  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content class="mat-typography content">
    <form [formGroup]="formGroup">
      <mat-form-field>
        <mat-label>{{ transloco('NAME') }}</mat-label>

        <input #storyName matInput formControlName="name" name="name">
      </mat-form-field>

      @if (data.isEditOperation) {
        <mat-form-field>
          <mat-label>{{ transloco('SCORE') }}</mat-label>
          <input #storyScore matInput formControlName="score" name="score" inputmode="numeric" pattern="[0-9]*" digitOnly>
        </mat-form-field>
      }
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      [mat-dialog-close]="cancelResult"
      class="action-button"
      >
      {{ transloco('CANCEL') }}
    </button>

    @if (data.isEditOperation) {
      <button
        mat-button
        [mat-dialog-close]="deleteResult"
        color="warn"
        class="action-button"
        >
        {{ transloco('DELETE') }}
      </button>
    }

    @if (data.isEditOperation && data.gameHasStarted) {
      <button
        mat-button
        [mat-dialog-close]="goToResult"
        color="primary"
        class="action-button"
        >
        {{ transloco('GO_TO') }}
      </button>
    }

    <button
      mat-button
      [mat-dialog-close]="saveResult"
      [disabled]="formGroup.invalid"
      color="accent"
      class="action-button"
      >
      {{ transloco('SAVE') }}
    </button>
  </mat-dialog-actions>
</ng-container>
